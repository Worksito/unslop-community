# Vérifie chaque pull request : le site compile, et chaque composant ajouté ou modifié respecte le format,
# passe le contrôle de sécurité et obtient sa vidéo d'aperçu (téléchargeable dans les « artifacts » de l'exécution).
# Volontairement en pull_request (et non pull_request_target) : le code des contributeurs tourne sans accès aux secrets.
name: Vérifier les composants

on:
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Le site compile
        run: |
          npx tsc -b
          npm run build

      - name: Format et sécurité des composants modifiés
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --name-only "origin/$BASE_REF...HEAD" > fichiers-modifies.txt
          xargs -a fichiers-modifies.txt -d '\n' node scripts/check-model.mjs --files

      - name: Filmer les aperçus des composants modifiés
        run: |
          slugs=$(xargs -a fichiers-modifies.txt -d '\n' node scripts/check-model.mjs --files --slugs)
          if [ -z "$slugs" ]; then echo "Aucun composant modifié."; exit 0; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm install -g puppeteer-core
          npm run dev -- --port 5173 --strictPort > /tmp/vite.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5173 > /dev/null && break; sleep 1; done
          npm run previews -- $slugs

      - name: Publier les aperçus pour la relecture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apercus
          path: public/previews/
          if-no-files-found: ignore
